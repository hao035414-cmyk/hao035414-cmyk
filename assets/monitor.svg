<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="system monitor">
  <title>system monitor</title>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="0.6" stop-color="#070A16"/>
      <stop offset="1" stop-color="#0A0716"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35E8FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#35E8FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FF45C8" stop-opacity="0.85"/>
      <stop offset="0.75" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9BF2FF"/>
    </linearGradient>
    <pattern id="mgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#35E8FF" stroke-width="0.4" stroke-opacity="0.06"/>
    </pattern>
    <style>
      .mono { font-family: 'Cascadia Mono','JetBrains Mono','SFMono-Regular',Consolas,ui-monospace,monospace; }
      .blink { animation: blink 2s steps(1,end) infinite; }
      @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: 0.2; } }
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(0); } 100% { transform: translateX(1080px); } }
    </style>
    <clipPath id="cardClip"><rect x="0" y="0" width="1200" height="190" rx="0"/></clipPath>
  </defs>

  <rect width="1200" height="190" fill="url(#mbg)"/>
  <rect width="1200" height="190" fill="url(#mgrid)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#topLine)"/>
  <rect x="0" y="188" width="1200" height="2" fill="url(#topLine)" opacity="0.5"/>

  <g clip-path="url(#cardClip)">
    <rect x="-120" y="0" width="120" height="190" fill="#35E8FF" opacity="0.05" class="sweep"/>
  </g>

  <g stroke="#7DF3FF" stroke-width="1.6" stroke-opacity="0.4" fill="none">
    <path d="M14 40 L14 14 L40 14"/>
    <path d="M1186 14 L1160 14 L1160 40"/>
    <path d="M14 150 L14 176 L40 176"/>
    <path d="M1160 150 L1160 176 L1186 176"/>
  </g>

  <circle cx="24" cy="30" r="3" fill="#35E8FF" class="blink"/>
  <text x="38" y="35" class="mono" font-size="11.5" fill="#5FE9FF" letter-spacing="3">SYS.MONITOR</text>
  <text x="1160" y="35" class="mono" font-size="11" fill="#46596F" letter-spacing="2" text-anchor="end">VERIFIED 2026.11 · NO CLOUD</text>

  <g class="mono">
    <g>
      <rect x="40" y="56" width="262" height="106" rx="6" fill="#080D1A" stroke="#1B3350" stroke-width="1"/>
      <rect x="40" y="56" width="3" height="106" fill="#35E8FF"/>
      <text x="62" y="106" font-size="42" font-weight="700" fill="url(#numGrad)">0.943</text>
      <text x="62" y="130" font-size="10.5" fill="#7A93B0" letter-spacing="2">DETECTION F1</text>
      <text x="62" y="148" font-size="10" fill="#516885" letter-spacing="1">160 IMG · 310 DEFECTS</text>
    </g>
    <g>
      <rect x="320" y="56" width="262" height="106" rx="6" fill="#0A0814" stroke="#3A1B34" stroke-width="1"/>
      <rect x="320" y="56" width="3" height="106" fill="#FF45C8"/>
      <text x="342" y="106" font-size="42" font-weight="700" fill="#FFD3F1">90.7%</text>
      <text x="342" y="130" font-size="10.5" fill="#B08AA6" letter-spacing="2">DEFECT RECALL</text>
      <text x="342" y="148" font-size="10" fill="#7D5268" letter-spacing="1">FALSE ALARM 0%</text>
    </g>
    <g>
      <rect x="600" y="56" width="262" height="106" rx="6" fill="#080B18" stroke="#252A50" stroke-width="1"/>
      <rect x="600" y="56" width="3" height="106" fill="#8B5CF6"/>
      <text x="622" y="106" font-size="42" font-weight="700" fill="#DDD2FF">4</text>
      <text x="622" y="130" font-size="10.5" fill="#8C8AB8" letter-spacing="2">PUBLIC REPOS</text>
      <text x="622" y="148" font-size="10" fill="#5B5A85" letter-spacing="1">ALL DEPENDENCY-FREE</text>
    </g>
    <g>
      <rect x="880" y="56" width="262" height="106" rx="6" fill="#080D1A" stroke="#1B3350" stroke-width="1"/>
      <rect x="880" y="56" width="3" height="106" fill="#35E8FF"/>
      <text x="902" y="106" font-size="42" font-weight="700" fill="url(#numGrad)">0</text>
      <text x="902" y="130" font-size="10.5" fill="#7A93B0" letter-spacing="2">CLOUD DEPENDENCY</text>
      <text x="902" y="148" font-size="10" fill="#516885" letter-spacing="1">RUNS OFFLINE · CPU ONLY</text>
    </g>
  </g>
</svg>
